name: devos-cycle
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
env:
  CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install the agent CLIs the cycle runs (reviewer + builders)
        run: node scripts/devos/install-clis.mjs
      - name: One attempt of one task
        run: node scripts/devos/cycle.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The reviewer's and builder's own agent credentials, exported only to their steps.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
