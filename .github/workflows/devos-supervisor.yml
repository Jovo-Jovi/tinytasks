name: devos-supervisor
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catch stuck automation
        run: node scripts/devos/supervisor.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
